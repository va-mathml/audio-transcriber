# Render Blueprint - bot + API + web UI in one free web service
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: audio-transcriber
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TRANSCRIPTION_LANGUAGE
        value: es
      - key: MAX_FILE_SIZE_MB
        value: "50"
